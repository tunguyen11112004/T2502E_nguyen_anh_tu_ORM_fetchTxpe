spring.application.name=BT_QL_muon_sach

# MySQL cho bài lab. Đổi username/password cho đúng máy bạn.
# Chưa có MySQL thì chạy: mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:mysql://localhost:3306/bt_ql_muon_sach?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

server.port=8080
